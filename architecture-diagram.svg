<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Row label -->
  <text x="30" y="30" font-size="13" font-weight="600" fill="#5f5e5a">1. INGESTION (offline, run once via ingest.py)</text>

  <!-- Row 1 boxes -->
  <g>
    <rect x="30" y="45" width="170" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="115" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#085041">denhaag.nl pages</text>
    <text x="115" y="90" font-size="12" text-anchor="middle" fill="#0F6E56">.txt files, data/raw/</text>
  </g>

  <line x1="200" y1="75" x2="235" y2="75" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="235" y="45" width="170" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="320" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#085041">Chunking</text>
    <text x="320" y="90" font-size="12" text-anchor="middle" fill="#0F6E56">~900 char, 150 overlap</text>
  </g>

  <line x1="405" y1="75" x2="440" y2="75" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="440" y="45" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="540" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#085041">Local embeddings</text>
    <text x="540" y="90" font-size="12" text-anchor="middle" fill="#0F6E56">all-MiniLM-L6-v2 (ONNX)</text>
  </g>

  <line x1="640" y1="75" x2="675" y2="75" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="675" y="45" width="195" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="772" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#3C3489">ChromaDB</text>
    <text x="772" y="90" font-size="12" text-anchor="middle" fill="#534AB7">persistent local store</text>
  </g>

  <!-- divider -->
  <line x1="30" y1="150" x2="870" y2="150" stroke="#e0ddd4" stroke-width="1"/>

  <text x="30" y="180" font-size="13" font-weight="600" fill="#5f5e5a">2. QUERY (live, on every chat message)</text>

  <!-- Row 2 -->
  <g>
    <rect x="30" y="195" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="105" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#444441">User question</text>
    <text x="105" y="240" font-size="12" text-anchor="middle" fill="#5f5e5a">Streamlit chat</text>
  </g>

  <line x1="180" y1="225" x2="210" y2="225" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="210" y="195" width="180" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="300" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#3C3489">Retrieve top-k</text>
    <text x="300" y="240" font-size="12" text-anchor="middle" fill="#534AB7">ChromaDB similarity search</text>
  </g>

  <line x1="390" y1="225" x2="420" y2="225" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="420" y="195" width="190" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="515" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#633806">Confidence check</text>
    <text x="515" y="240" font-size="12" text-anchor="middle" fill="#854F0B">distance vs. threshold</text>
  </g>

  <!-- branch down to decline -->
  <line x1="515" y1="255" x2="515" y2="300" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="280" font-size="12" fill="#5f5e5a">low confidence</text>
  <g>
    <rect x="420" y="300" width="190" height="55" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="515" y="323" font-size="14" font-weight="600" text-anchor="middle" fill="#791F1F">Decline</text>
    <text x="515" y="342" font-size="12" text-anchor="middle" fill="#A32D2D">"I don't know, check denhaag.nl"</text>
  </g>

  <!-- branch right to LLM -->
  <line x1="610" y1="225" x2="645" y2="225" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="616" y="212" font-size="12" fill="#5f5e5a">high confidence</text>
  <g>
    <rect x="645" y="195" width="220" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="755" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#0C447C">LLM (Groq)</text>
    <text x="755" y="240" font-size="12" text-anchor="middle" fill="#185FA5">answers using retrieved chunks only</text>
  </g>

  <line x1="755" y1="255" x2="755" y2="300" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="645" y="300" width="220" height="55" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="755" y="323" font-size="14" font-weight="600" text-anchor="middle" fill="#27500A">Answer + source</text>
    <text x="755" y="342" font-size="12" text-anchor="middle" fill="#3B6D11">grounded answer, cited snippet</text>
  </g>

  <text x="450" y="400" font-size="12" text-anchor="middle" fill="#888780">All retrieval and embedding runs locally. Only the final prompt + retrieved context is sent to the Groq API.</text>
</svg>
